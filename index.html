<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- ADD THESE META TAGS HERE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>Luyện Tiếng Anh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- View 1: Màn hình chọn bài học -->
    <section id="view-home" class="view active">
      <header class="home-header">
        <h1>🎧 Luyện Tiếng Anh</h1>
        <p>Chọn bài học để bắt đầu luyện nghe và phát âm.</p>
      </header>
      <div id="unit-grid" class="unit-grid"></div>

      <!-- Nút mở thông tin trung tâm -->
      <footer class="app-footer">
        <button id="btn-info" class="btn-info">ℹ️ Thông tin trung tâm</button>
      </footer>
    </section>

    <!-- View 2: Màn hình chi tiết bài học -->
    <section id="view-unit" class="view">
      <header class="detail-header">
        <button id="btn-back" class="btn-back" aria-label="Quay lại">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h2 id="detail-unit-title">Chi Tiết Bài Học</h2>
      </header>

      <div id="sentence-list" class="sentence-list"></div>
    </section>
  </div>

  <!-- Modal Credits / Thông Tin Liên Hệ -->
  <div id="info-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>🏛️ Trung Tâm Ngoại Ngữ Anh Việt</h3>
      <div class="info-content">
        <p>📞 <strong>Hotline:</strong> <a href="tel:0396721223">0396.721.223</a></p>
        <p>📍 <strong>Địa chỉ:</strong> Ấp 1, Cái Đôi Vàm, Phú Tân, Cà Mau</p>
      </div>
      <button id="btn-close-modal" class="btn-close">Đóng</button>
    </div>
  </div>

 <!-- ADD ?v=1.1 (or whatever version you are on) TO THESE LINES AT THE BOTTOM OF INDEX.HTML -->
  <script src="units.js?v=1.2"></script>
  <script src="app.js?v=1.2"></script>
</body>
</html>
