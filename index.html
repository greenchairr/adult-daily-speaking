<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Keeps the layout locked at 100% scale without zooming issues -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luyện Tiếng Anh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- View 1: Màn hình chọn bài học -->
    <section id="view-home" class="view active">
      <header class="home-header">
        <h1>🎧 Luyện Tiếng Anh</h1>
        <p>Chọn bài học để bắt đầu luyện nghe và phát âm.</p>
      </header>
      <div id="unit-grid" class="unit-grid"></div>
    </section>

    <!-- View 2: Màn hình chi tiết bài học -->
    <section id="view-unit" class="view">
      <header class="detail-header">
        <button id="btn-back" class="btn-back" aria-label="Quay lại">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h2 id="detail-unit-title">Chi Tiết Bài Học</h2>
      </header>

      <div id="sentence-list" class="sentence-list"></div>
    </section>
  </div>

  <script src="units.js"></script>
  <script src="app.js"></script>
</body>
</html>
