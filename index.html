<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Practice Hub</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎧 English Practice</h1>
      <p>Select a unit, listen to the native pronunciation, and practice speaking.</p>
    </header>

    <!-- Unit Selection Buttons -->
    <nav id="unit-nav" class="unit-nav"></nav>

    <!-- Current Unit Header & Sentences -->
    <main>
      <h2 id="current-unit-title"></h2>
      <div id="sentence-list" class="sentence-list"></div>
    </main>
  </div>

  <script src="units.js"></script>
  <script src="app.js"></script>
</body>
</html>
